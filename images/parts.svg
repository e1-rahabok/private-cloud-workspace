<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker></defs>
<rect width="960" height="500" fill="#ffffff"/>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#222" text-anchor="start">One body of knowledge, five parts</text>
<rect x="20" y="44" width="14" height="14" rx="3" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="40" y="56" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">By people, for people</text>
<rect x="194.29999999999998" y="44" width="14" height="14" rx="3" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="214.29999999999998" y="56" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">For AI to read</text>
<rect x="324.5" y="44" width="14" height="14" rx="3" fill="#efe9f8" stroke="#5e35b1" stroke-width="1.4"/>
<text x="344.5" y="56" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">For people, built with AI</text>
<rect x="524.0" y="44" width="14" height="14" rx="3" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
<text x="544.0" y="56" font-size="11.5" font-weight="normal" fill="#333" text-anchor="start">No AI</text>
<rect x="20" y="90" width="250" height="81" rx="6" fill="#e6f4e4" stroke="#2e7d32" stroke-width="1.4"/>
<text x="30" y="109" font-size="13" font-weight="bold" fill="#173a16" text-anchor="start">The Book</text>
<text x="30" y="128" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start">Private Cloud Management, 4 parts,</text>
<text x="30" y="143" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start">with spreadsheets, slides, diagrams.</text>
<text x="30" y="158" font-size="11.5" font-weight="normal" fill="#173a16" text-anchor="start">Curated by people, for people.</text>
<rect x="355" y="230" width="250" height="81" rx="6" fill="#e4edfa" stroke="#1f5fae" stroke-width="1.4"/>
<text x="365" y="249" font-size="13" font-weight="bold" fill="#0d2a4d" text-anchor="start">Agent E2: the brain</text>
<text x="365" y="268" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Holds the knowledge, for AI to read.</text>
<text x="365" y="283" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">Answers questions; defines every</text>
<text x="365" y="298" font-size="11.5" font-weight="normal" fill="#0d2a4d" text-anchor="start">KPI, threshold and metric name.</text>
<rect x="690" y="90" width="250" height="96" rx="6" fill="#efe9f8" stroke="#5e35b1" stroke-width="1.4"/>
<text x="700" y="109" font-size="13" font-weight="bold" fill="#2a1650" text-anchor="start">isvara.io</text>
<text x="700" y="128" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">Public website for learning:</text>
<text x="700" y="143" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">articles, tools, practice, Ask.</text>
<text x="700" y="158" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">Articles written by AI from Agent E2.</text>
<text x="700" y="173" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">The Book to download.</text>
<rect x="690" y="380" width="250" height="81" rx="6" fill="#efe9f8" stroke="#5e35b1" stroke-width="1.4"/>
<text x="700" y="399" font-size="13" font-weight="bold" fill="#2a1650" text-anchor="start">Private Cloud Manager (PCM)</text>
<text x="700" y="418" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">Web app for operations teams.</text>
<text x="700" y="433" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">Shows the KPIs; Agent E2 explains</text>
<text x="700" y="448" font-size="11.5" font-weight="normal" fill="#2a1650" text-anchor="start">them. A demo in release 1.0.</text>
<rect x="20" y="380" width="250" height="96" rx="6" fill="#ffffff" stroke="#888888" stroke-width="1.4"/>
<text x="30" y="399" font-size="13" font-weight="bold" fill="#333333" text-anchor="start">VCF vCommunity Adapter</text>
<text x="30" y="418" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">Management pack for VCF</text>
<text x="30" y="433" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">Operations 9.1. Calculates the</text>
<text x="30" y="448" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">Agent E2 KPIs; adds features.</text>
<text x="30" y="463" font-size="11.5" font-weight="normal" fill="#333333" text-anchor="start">No AI.</text>
<path d="M 270 110 L 690 110" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="415" y="92" width="130" height="15" fill="#ffffff" opacity="0.92"/>
<text x="480" y="103" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">the Book to download</text>
<path d="M 145 171 L 145 250 L 355 250" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="56" y="204" width="179" height="15" fill="#ffffff" opacity="0.92"/>
<text x="145" y="215" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">extracted; kept in agreement</text>
<path d="M 605 250 L 780 250 L 780 186" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="619" y="232" width="142" height="15" fill="#ffffff" opacity="0.92"/>
<text x="690" y="243" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">articles; Ask Agent E2</text>
<path d="M 420 311 L 420 428 L 270 428" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="274" y="410" width="142" height="15" fill="#ffffff" opacity="0.92"/>
<text x="345" y="421" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">KPI definitions, names</text>
<path d="M 540 311 L 540 400 L 690 400" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="559" y="382" width="112" height="15" fill="#ffffff" opacity="0.92"/>
<text x="615" y="393" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">explains the KPIs</text>
<path d="M 270 455 L 690 455" fill="none" stroke="#555555" stroke-width="1.5" marker-end="url(#ah)"/>
<rect x="384" y="437" width="191" height="15" fill="#ffffff" opacity="0.92"/>
<text x="480" y="448" font-size="10.5" font-weight="normal" fill="#555555" text-anchor="middle">KPIs, read from VCF Operations</text>
</svg>
