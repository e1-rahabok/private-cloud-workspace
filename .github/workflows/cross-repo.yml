name: Cross-repo checks for a child repository

# Called by the CI of each child repository (R-WS-002), so a pull request there runs the workspace's cross-repo
# checks with its own branch in place of that repository's main. The caller's workflow is:
#
#   on: {pull_request: {}, push: {branches: [main]}, schedule: [{cron: "0 22 * * *"}], workflow_dispatch: {}}
#   permissions: {contents: read}
#   jobs:
#     cross-repo:
#       uses: e1-rahabok/private-cloud-workspace/.github/workflows/cross-repo.yml@main
#
# isvara is private: only isvara's own run can read it, with its own token. The review pages are not checked here:
# a child's new requirement changes a workspace page, which the workspace's own CI checks once the child has merged.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: e1-rahabok/private-cloud-workspace
          ref: main
          path: private-cloud-workspace
      - uses: actions/checkout@v4
        with:
          repository: e1-rahabok/agent-e2
          ref: ${{ github.repository == 'e1-rahabok/agent-e2' && github.sha || 'main' }}
          path: agent-e2
      - uses: actions/checkout@v4
        with:
          repository: e1-rahabok/PCM-Adapter
          ref: ${{ github.repository == 'e1-rahabok/PCM-Adapter' && github.sha || 'main' }}
          path: PCM-Adapter
      - uses: actions/checkout@v4
        with:
          repository: e1-rahabok/private-cloud-manager
          ref: ${{ github.repository == 'e1-rahabok/private-cloud-manager' && github.sha || 'main' }}
          path: private-cloud-manager
      - uses: actions/checkout@v4
        if: github.repository == 'e1-rahabok/isvara'
        with:
          path: isvara
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 requests==2.32.3
      - name: Production dependencies have no high or critical advisory (R-WS-012)
        working-directory: ${{ github.event.repository.name }}
        run: |
          if [ -f package-lock.json ]; then npm audit --omit=dev --audit-level=high; else echo "no package-lock.json: not run"; fi
      - name: Contract and name checks
        run: python private-cloud-workspace/contract-checks/run_all.py --no-clone
      - name: Planted breaks of the checks
        run: |
          python -m unittest discover -s private-cloud-workspace/contract-checks -p "test_*.py"
          python -m unittest discover -s private-cloud-workspace/tools -p "test_*.py"
      - name: Requirements, test scenarios and sources of every repository read here
        run: |
          repos="agent-e2 PCM-Adapter private-cloud-manager"
          if [ -d isvara ]; then repos="$repos isvara"; fi
          python private-cloud-workspace/tools/spec_check.py --repos $repos
      - name: Writing style of the calling repository (R-WS-006)
        run: python private-cloud-workspace/tools/style.py --repo ${{ github.event.repository.name }}
