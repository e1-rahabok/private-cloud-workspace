name: Cross-repo checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: private-cloud-workspace
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: e1-rahabok/agent-e2
          path: agent-e2
      - uses: actions/checkout@v4
        with:
          repository: e1-rahabok/PCM-Adapter
          path: PCM-Adapter
      - uses: actions/checkout@v4
        with:
          repository: e1-rahabok/private-cloud-manager
          path: private-cloud-manager
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 requests==2.32.3
      - run: python private-cloud-workspace/checks/run_all.py --no-clone
      - name: Planted breaks of the contract checks
        run: python -m unittest discover -s private-cloud-workspace/checks -p "test_*.py"
      - name: Requirements, test scenarios and sources
        run: python private-cloud-workspace/tools/spec_check.py --repos agent-e2 PCM-Adapter private-cloud-manager
      - name: Milestone review pages are up to date
        run: python private-cloud-workspace/tools/milestone_review.py --check --repos agent-e2 PCM-Adapter private-cloud-manager
      - name: Writing style of documents for people
        run: python private-cloud-workspace/tools/style.py
      - name: Links and diagram text
        run: python private-cloud-workspace/tools/docs.py --check
      - name: Every repository has the workspace's CLAUDE.md (DESIGN-22)
        run: python private-cloud-workspace/tools/claude_md_copies.py agent-e2 PCM-Adapter private-cloud-manager
      - name: Changes stay in the open milestone (DESIGN-21)
        if: github.event_name == 'pull_request'
        run: python private-cloud-workspace/tools/milestone_gate.py --check origin/${{ github.base_ref }}
      - name: Diagrams are up to date
        run: |
          python private-cloud-workspace/tools/diagrams.py
          git -C private-cloud-workspace diff --exit-code -- images
